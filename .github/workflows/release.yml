name: release

on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Next version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/master
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current=$(go tool svu current)
          next=$(go tool svu next --v0)
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          if [ "$next" = "$current" ]; then
            echo "No feat or fix commit since $current, nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $next (was $current)"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check tap token
        if: steps.version.outputs.release == 'true'
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_GITHUB_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN secret is not set"
            exit 1
          fi
      - name: Test
        if: steps.version.outputs.release == 'true'
        run: go test -race ./...
      - name: Tag
        if: steps.version.outputs.release == 'true' && github.ref_type == 'branch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
      - uses: goreleaser/goreleaser-action@v7
        if: steps.version.outputs.release == 'true'
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
