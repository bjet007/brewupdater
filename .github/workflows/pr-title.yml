name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check PR title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|ci|build|chore|style|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "PR title is a Conventional Commit: $TITLE"
            exit 0
          fi
          msg="PR title is not a Conventional Commit, so the squash commit won't trigger a release. Expected '<type>(<scope>): <summary>', e.g. 'fix(checklist): fit the checklist to the terminal height'."
          echo "::warning title=PR title::$msg"
          {
            echo "### ⚠️ PR title"
            echo
            echo "\`$TITLE\`"
            echo
            echo "$msg"
          } >> "$GITHUB_STEP_SUMMARY"
